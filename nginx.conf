worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Only content-addressed filenames receive immutable caching.
    map "$status:$uri" $asset_cache_control {
        default "no-cache";
        "~^(200|206|304):/assets/.+-[A-Za-z0-9_-]{8,}\.(js|css|wasm|woff2?|png|svg)$" "public, max-age=31536000, immutable";
        "~^(200|206|304):/data/[^/]+\.[a-f0-9]{12}\.(sqlite\.bin|bin|json)$" "public, max-age=31536000, immutable";
    }

    server {
        listen 8080;
        listen [::]:8080;
        root /usr/share/nginx/html;
        index index.html;

        # Defined together at server scope so cache locations retain every header.
        add_header Cache-Control $asset_cache_control always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; worker-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }
        location = /index.html { try_files $uri =404; }
        location = /sw.js { try_files $uri =404; }
        location = /manifest.webmanifest {
            types { application/manifest+json webmanifest; }
            try_files $uri =404;
        }
        location ~ \.wasm$ {
            types { application/wasm wasm; }
            try_files $uri =404;
        }
        location ^~ /data/ { try_files $uri =404; }
        location ~ \.(js|css|json|webmanifest|png|jpe?g|gif|svg|ico|woff2?|mp3|bin|gz|map|txt)$ {
            try_files $uri =404;
        }
        location / { try_files $uri $uri/ /index.html; }
    }
}
